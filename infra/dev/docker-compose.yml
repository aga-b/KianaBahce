# Yerel geliştirme PostgreSQL'i; yalnız localhost'a bağlanır. Değerler yalnız geliştirme içindir.
name: kiana-dev
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: kiana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiana_dev}
      POSTGRES_DB: kiana_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiana -d kiana_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
